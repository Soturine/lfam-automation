<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 758 330" width="758" height="330"><rect width="100%" height="100%" rx="10" fill="#101923"/><text x="14.0" y="24.0" font-family="Consolas,Menlo,monospace" font-size="12" fill="#9db0bf" text-anchor="start" font-weight="normal">ALM_PRESSAO_16_5: pressao &gt;= 16,5 MPa</text><g transform="translate(0,18)"><line x1="10" y1="0" x2="10" y2="74" stroke="#42c9e8" stroke-width="3"/><line x1="20.0" y1="45.0" x2="40.0" y2="45.0" stroke="#6fa3b8" stroke-width="2" stroke-linecap="round"/><rect x="40" y="27.0" width="175.4" height="36" rx="5" fill="#1c2b39" stroke="#42c9e8" stroke-width="2"/><text x="127.7" y="49.0" font-family="Consolas,Menlo,monospace" font-size="11" fill="#e8f0f6" text-anchor="middle" font-weight="normal">PT_FUNDIDO_MPA &gt;= 16.5</text><line x1="215.4" y1="45.0" x2="255.4" y2="45.0" stroke="#6fa3b8" stroke-width="2" stroke-linecap="round"/><circle cx="273.4" cy="45.0" r="15" fill="none" stroke="#4ed5a3" stroke-width="3"/><line x1="255.4" y1="45.0" x2="258.4" y2="45.0" stroke="#6fa3b8" stroke-width="2" stroke-linecap="round"/><text x="273.4" y="23.0" font-family="Consolas,Menlo,monospace" font-size="11" fill="#e8f0f6" text-anchor="middle" font-weight="normal">ALM_PRESSAO_16_5</text></g><text x="14.0" y="128.0" font-family="Consolas,Menlo,monospace" font-size="12" fill="#9db0bf" text-anchor="start" font-weight="normal">REF_RPM_LIM := LIMIT(17, SP (x0,9 se alarme), 34) - unico escritor</text><g transform="translate(0,122)"><line x1="10" y1="0" x2="10" y2="74" stroke="#42c9e8" stroke-width="3"/><line x1="20.0" y1="45.0" x2="40.0" y2="45.0" stroke="#6fa3b8" stroke-width="2" stroke-linecap="round"/><rect x="40" y="27.0" width="664.5" height="36" rx="5" fill="#1c2b39" stroke="#4ed5a3" stroke-width="2"/><text x="372.2" y="49.0" font-family="Consolas,Menlo,monospace" font-size="11" fill="#e8f0f6" text-anchor="middle" font-weight="normal">REF_RPM_LIM := LIMIT(17.0, SEL(ALM_PRESSAO_16_5, SP_RPM_OPERADOR, SP_RPM_OPERADOR * 0.9), 34.0)</text></g><text x="14.0" y="232.0" font-family="Consolas,Menlo,monospace" font-size="12" fill="#9db0bf" text-anchor="start" font-weight="normal">INV_REF (unico escritor): rpm -&gt; escala do inversor (hipotese 16384 = 60 Hz)</text><g transform="translate(0,226)"><line x1="10" y1="0" x2="10" y2="74" stroke="#42c9e8" stroke-width="3"/><line x1="20.0" y1="45.0" x2="40.0" y2="45.0" stroke="#6fa3b8" stroke-width="2" stroke-linecap="round"/><rect x="40" y="27.0" width="470.2" height="36" rx="5" fill="#1c2b39" stroke="#4ed5a3" stroke-width="2"/><text x="275.1" y="49.0" font-family="Consolas,Menlo,monospace" font-size="11" fill="#e8f0f6" text-anchor="middle" font-weight="normal">INV_REF := REAL_TO_INT(REF_RPM_LIM / 34.0 * 57.0 / 60.0 * 16384.0)</text></g></svg>